name: Daily Report

on:
  schedule:
    # UTC 22:00 Sun-Thu = JST 07:00 Mon-Fri
    - cron: "0 22 * * 0-4"
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price/fundamentals DB cache
        uses: actions/cache@v4
        with:
          path: data/stock_screener.db
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: Run daily batch
        run: python -m src.main

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/
          git diff --staged --quiet || git commit -m "Daily report $(date -u +'%Y-%m-%d')"
          git push
