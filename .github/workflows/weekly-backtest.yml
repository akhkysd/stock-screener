name: Weekly Backtest

on:
  schedule:
    # UTC 21:00 Sat = JST 06:00 Sun
    - cron: "0 21 * * 6"
  workflow_dispatch:

concurrency:
  group: weekly-backtest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price/fundamentals DB cache
        uses: actions/cache/restore@v4
        with:
          path: data/stock_screener.db
          key: stock-db-
          restore-keys: |
            stock-db-

      - name: Run backtest
        run: python -m src.backtest.run_backtest

      - name: Commit backtest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/backtest_report.md
          git diff --staged --quiet || git commit -m "Weekly backtest report $(date -u +'%Y-%m-%d')"
          git push
